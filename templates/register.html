{% extends "base.html" %}
{% block title %}Register - CardWapas{% endblock %}
{% block content %}
<div class="narrow mx-auto">
  <h2 class="mb-3">Create your account</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Name</label>
      <input class="form-control" name="name" required maxlength="80"></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" required maxlength="120"></div>
    <div class="mb-3"><label class="form-label">Phone (optional, never shown to finders)</label>
      <input class="form-control" name="phone" maxlength="20"></div>
    <div class="mb-3"><label class="form-label">Password (min 8 characters)</label>
      <input class="form-control" type="password" name="password" required minlength="8"></div>
    <button class="btn btn-primary w-100">Register</button>
  </form>
  <p class="mt-3">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
