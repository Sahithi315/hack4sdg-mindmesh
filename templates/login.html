{% extends "base.html" %}
{% block title %}Log in - CardWapas{% endblock %}
{% block content %}
<div class="narrow mx-auto">
  <h2 class="mb-3">Log in</h2>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label">Email</label>
      <input class="form-control" type="email" name="email" required></div>
    <div class="mb-3"><label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="mt-3">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
